data:
  raw_dir: data/raw/diversevul
  processed_dir: data/processed
  max_seq_len: 500
  vocab_size: 10000
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

model:
  embed_dim: 128
  hidden_size: 128
  num_layers: 2
  dropout: 0.3
  attention_dim: 64
  cnn_num_filters: 128
  cnn_kernel_sizes: [3, 5, 7]
  num_attention_heads: 4

training:
  batch_size: 64
  lr: 0.001
  epochs: 20
  patience: 4
  grad_clip: 1.0
  seed: 42
  device: cuda
  use_focal_loss: true
  focal_alpha: 0.5
  focal_gamma: 2.0
  use_warmup_cosine: true
  oversample_factor: 2.5

evaluation:
  threshold_objective: f2
  threshold_beta: 2.0
  threshold_min_recall: 0.35
  threshold_start: 0.05
  threshold_end: 0.90
  threshold_step: 0.01
  ensemble_strategy: quorum
  ensemble_quorum: 3

results_dir: results/
